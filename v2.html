<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Cardápio da Cantina - Colégio Imperatriz</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="https://unpkg.com/@supabase/supabase-js"></script>
</head>
<body class="bg-slate-100 p-4 font-sans">

<!-- ====== CONTAINER PRINCIPAL ====== -->
<div class="max-w-6xl mx-auto">
  <!-- ====== CABEÇALHO ====== -->
  <header class="flex flex-wrap items-center justify-between mb-4 gap-2">
    <div class="flex items-center gap-3">
      <img src="https://i.ibb.co/gMKBY30P/Icone-CItransparente.png" alt="Logo" class="h-12" />
      <div>
        <h1 id="titulo" class="text-2xl font-semibold text-green-600">Cardápio da Cantina</h1>
        <p class="text-sm text-slate-500">
          Cadastro de lanches (manhã/tarde) - Colégio Imperatriz 🍽️🥗🍖🍊🍮
        </p>
      </div>
    </div>
    <div class="space-x-2">
      <button onclick="changeMonth(-1)" class="btn">◀</button>
      <button onclick="goToday()" class="btn">Hoje</button>
      <button onclick="changeMonth(1)" class="btn">▶</button>
      <button id="exportBtn" onclick="generateImage()" class="btn-primary">Exportar PNG</button>
      <button id="exportPdfBtn" onclick="generatePDF()" class="btn-primary bg-red-600">Exportar PDF</button>
    </div>
  </header>

  <!-- ====== CALENDÁRIO ====== -->
  <div id="calendar" class="p-4 bg-white rounded-2xl shadow-md">
    <div class="grid grid-cols-6 gap-2 text-center mb-2 font-medium text-base">
      <div>Seg</div><div>Ter</div><div>Qua</div><div>Qui</div><div>Sex</div><div>Sáb</div>
    </div>
    <div id="calendar-grid" class="grid grid-cols-6 gap-2"></div>
  </div>
</div>

<!-- ====== MODAL DE EDIÇÃO ====== -->
<div id="modal" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50">
  <div class="bg-white p-6 rounded-xl shadow-xl w-96 space-y-4">
    <h2 class="text-lg font-semibold text-green-600">Editar Cardápio</h2>
    <p id="modal-date" class="text-sm text-slate-500"></p>
    <textarea id="manha" placeholder="Lanche da manhã..." class="w-full border rounded p-2 h-20"></textarea>
    <textarea id="tarde" placeholder="Lanche da tarde..." class="w-full border rounded p-2 h-20"></textarea>
    <div class="flex justify-between">
      <button id="deleteBtn" class="px-3 py-1 bg-red-500 text-white rounded">Excluir</button>
      <div class="space-x-2">
        <button onclick="closeModal()" class="btn">Cancelar</button>
        <button onclick="saveDay()" class="btn-primary">Salvar</button>
      </div>
    </div>
  </div>
</div>

<style>
  .btn { padding: 0.5rem 0.75rem; border-radius: .5rem; border: 1px solid #e2e8f0; background: white }
  .btn-primary { padding: 0.5rem 0.75rem; border-radius: .5rem; background: #16a34a; color: white; border: none }
</style>

<script>
const SUPABASE_URL = "https://lfhgyyhzvhmdphgbvblc.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImxmaGd5eWh6dmhtZHBoZ2J2YmxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk5MzEzOTYsImV4cCI6MjA3NTUwNzM5Nn0.ZAcoIbeOQFIo01qW_rcKIkJKvneqgeN6rpPSCFvTe1Y";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const calendarGrid = document.getElementById("calendar-grid");
const titulo = document.getElementById("titulo");
let viewDate = new Date();
viewDate = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
let menuData = {};
let currentISO = "";

function formatISO(y, m, d) {
  return `${y}-${String(m + 1).padStart(2, "0")}-${String(d).padStart(2, "0")}`;
}
function escapeHtml(str) {
  return str ? str.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c])) : "";
}

async function loadData() {
  const { data, error } = await supabaseClient.from("cardapio_cantina").select("data_iso, manha, tarde");
  if (error) return console.error(error);
  menuData = {};
  data.forEach(r => menuData[r.data_iso] = { manha: r.manha, tarde: r.tarde });
  renderCalendar();
}

function renderCalendar() {
  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  titulo.textContent = `Cardápio da Cantina — ${viewDate.toLocaleString("pt-BR",{month:"long"})} ${year}`;
  calendarGrid.innerHTML = "";

  const daysInMonth = new Date(year, month + 1, 0).getDate();
  let filledCols = 0;
  const createEmptyCell = () => {
    const div = document.createElement("div");
    div.className = "p-2 min-h-[100px]";
    return div;
  };

  for (let d = 1; d <= daysInMonth; d++) {
    const dt = new Date(year, month, d);
    const weekday = dt.getDay(); 
    if (weekday === 0) continue;
    const col = weekday - 1;
    if (filledCols > col) while (filledCols < 6) calendarGrid.appendChild(createEmptyCell()), filledCols++;
    if (filledCols >= 6) filledCols = 0;
    while (filledCols < col) calendarGrid.appendChild(createEmptyCell()), filledCols++;

    const iso = formatISO(year, month, d);
    const entry = menuData[iso] || {};
    const div = document.createElement("div");
    div.className = "p-3 border rounded bg-white min-h-[110px] text-base shadow-sm hover:shadow-md transition";
    div.innerHTML = `
      <div class="flex justify-between items-start">
        <div class="font-semibold">${d}</div>
        <div class="text-xs text-slate-400">${dt.toLocaleDateString()}</div>
      </div>
      <div class="text-left whitespace-pre-wrap break-words mt-1">
        ${entry.manha ? `<div><b>Manhã:</b> ${escapeHtml(entry.manha)}</div>` : `<div class='text-slate-400'>Clique para editar</div>`}
        ${entry.tarde ? `<div><b>Tarde:</b> ${escapeHtml(entry.tarde)}</div>` : ``}
      </div>
      <div class="text-right mt-2">
        <button onclick="openModalForDay('${iso}')" class="text-xs underline text-green-700">Editar</button>
      </div>`;
    calendarGrid.appendChild(div);
    filledCols++;
  }
  while (filledCols > 0 && filledCols < 6) calendarGrid.appendChild(createEmptyCell()), filledCols++;
}

function openModalForDay(iso) {
  currentISO = iso;

  const entry = menuData[iso] || {};
  document.getElementById("manha").value = entry.manha || "";
  document.getElementById("tarde").value = entry.tarde || "";

  const [year, month, day] = iso.split("-").map(Number);
  const dataLocal = new Date(year, month - 1, day);

  document.getElementById("modal-date").textContent =
    dataLocal.toLocaleDateString("pt-BR", {
      weekday: "long",
      day: "numeric",
      month: "long"
    });

  document.getElementById("modal").classList.remove("hidden");
}

function closeModal() {
  document.getElementById("modal").classList.add("hidden");
}

async function saveDay() {
  const manha = document.getElementById("manha").value.trim();
  const tarde = document.getElementById("tarde").value.trim();
  await supabaseClient.from("cardapio_cantina").upsert({ data_iso: currentISO, manha, tarde });
  closeModal(); loadData();
}

document.getElementById("deleteBtn").onclick = async () => {
  if (!confirm("Excluir este dia?")) return;
  await supabaseClient.from("cardapio_cantina").delete().eq("data_iso", currentISO);
  closeModal(); loadData();
};

function changeMonth(delta){ viewDate=new Date(viewDate.getFullYear(),viewDate.getMonth()+delta,1); renderCalendar();}
function goToday(){ const d=new Date(); viewDate=new Date(d.getFullYear(),d.getMonth(),1); renderCalendar();}

/* ====== EXPORTAÇÃO IMAGEM (PNG) ====== */
async function prepareExportWrapper(){
  const calendar = document.getElementById("calendar").cloneNode(true);
  calendar.querySelectorAll("button").forEach(b => b.remove());

  const style = document.createElement("style");
  style.textContent = `
    *{
      font-size:14px !important;
      line-height:1.15 !important;
      font-family:Arial,sans-serif;
    }
    #calendar-grid {
      gap: 2px !important;
    }
    #calendar-grid > div{
      padding:5px !important;
      min-height:100px !important;
      border:1px solid #d1d5db !important;
    }
    #calendar {
      padding: 8px !important;
    }
    h2{
      font-size:30px !important;
      margin-bottom:8px;
    }
    header, .text-slate-500 {
      display: none !important;
    }
  `;
  calendar.prepend(style);

  const wrap = document.createElement("div");
  wrap.style.position = "absolute";
  wrap.style.left = "-9999px";
  wrap.style.width = "1123px";
  wrap.style.background = "#fff";
  wrap.style.padding = "30px";
  wrap.style.boxSizing = "border-box";
  wrap.style.borderRadius = "0";

  const header = document.createElement("div");
  header.className = "flex items-center gap-3 mb-3";
  header.innerHTML = `
    <img src='https://i.ibb.co/gMKBY30P/Icone-CItransparente.png' class='h-12'>
    <div>
      <h2 class='text-green-600 text-2xl font-bold'>Cardápio da Cantina — ${viewDate.toLocaleString("pt-BR",{month:"long"})}/${viewDate.getFullYear()}</h2>
      <div class='text-lg'>🍽️🥗🍖🍊🍮</div>
    </div>`;  
  wrap.appendChild(header);
  wrap.appendChild(calendar);
  calendar.style.boxSizing = "border-box";
  document.body.appendChild(wrap);
  await new Promise(r => setTimeout(r, 150));
  return {wrap};
}

async function generateImage(){
  const {wrap} = await prepareExportWrapper();
  const canvas = await html2canvas(wrap,{scale:1.2,backgroundColor:"#fff",useCORS:true});
  const link = document.createElement("a");
  link.href = canvas.toDataURL("image/png");
  link.download = `cantina-${viewDate.getFullYear()}-${String(viewDate.getMonth()+1).padStart(2,"0")}.png`;
  link.click();
  wrap.remove();
}

/* ====== EXPORTAÇÃO PDF (AJUSTADO PARA 1 PÁGINA PERFEITA) ====== */
function generatePDF(){
  const printWindow = window.open("", "_blank");

  if(!printWindow){
      alert("Permita pop-ups para gerar o PDF.");
      return;
  }

  const year = viewDate.getFullYear();
  const month = viewDate.getMonth();
  const monthName = viewDate.toLocaleString("pt-BR",{ month:"long" });

  let html = `<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cardápio da Cantina</title>
<style>
@page {
    size: A4 landscape;
    margin: 4mm;
}
* {
    box-sizing: border-box;
}
html, body {
    width: 100%;
    height: 100vh;
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    color: #1f2937;
    overflow: hidden;
}
body {
    display: flex;
    flex-direction: column;
    padding: 2mm;
}
.header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 4px;
    flex-shrink: 0;
}
.header img {
    width: 40px;
    height: auto;
}
.title {
    font-size: 16px;
    font-weight: bold;
    color: #16a34a;
    line-height: 1.1;
}
.subtitle {
    font-size: 10px;
    line-height: 1;
}
.calendar-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    max-height: 94vh;
}
.week-header {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    gap: 3px;
    margin-bottom: 2px;
    flex-shrink: 0;
}
.week {
    text-align: center;
    font-weight: bold;
    background: #e2e8f0;
    padding: 2px;
    font-size: 10px;
    border-radius: 3px;
}
.calendar-grid {
    display: grid;
    grid-template-columns: repeat(6, 1fr);
    grid-auto-rows: 1fr;
    gap: 3px;
    flex: 1;
}
.day {
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    padding: 2px 4px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    background: #fff;
}
.day-header {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-bottom: 1px solid #f1f5f9;
    padding-bottom: 1px;
    margin-bottom: 2px;
}
.day-number {
    font-size: 11px;
    font-weight: bold;
}
.date {
    font-size: 8.5px;
    color: #64748b;
}
.menu {
    font-size: 8.5px;
    line-height: 1.1;
    white-space: pre-wrap;
    word-break: break-word;
    flex: 1;
}
.empty {
    visibility: hidden;
    border: none;
}
@media print {
    body {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
    }
}
</style>
</head>
<body>

<div class="header">
  <img src="https://i.ibb.co/gMKBY30P/Icone-CItransparente.png" alt="Logo">
  <div>
    <div class="title">Cardápio da Cantina — ${monthName.toUpperCase()}/${year}</div>
    <div class="subtitle">🍽️🥗🍖🍊🍮</div>
  </div>
</div>

<div class="calendar-container">
  <div class="week-header">
    <div class="week">Seg</div>
    <div class="week">Ter</div>
    <div class="week">Qua</div>
    <div class="week">Qui</div>
    <div class="week">Sex</div>
    <div class="week">Sáb</div>
  </div>
  <div class="calendar-grid">`;

  let filled = 0;

  for(let d=1; d<=new Date(year,month+1,0).getDate(); d++){
      const dt = new Date(year,month,d);
      const weekday = dt.getDay();

      if(weekday===0) continue;

      const col = weekday - 1;

      while(filled < col){
          html += `<div class="day empty"></div>`;
          filled++;
      }

      const iso = formatISO(year,month,d);
      const entry = menuData[iso] || {};

      html += `
    <div class="day">
      <div class="day-header">
        <span class="day-number">${d}</span>
        <span class="date">${dt.toLocaleDateString("pt-BR")}</span>
      </div>
      <div class="menu">
        ${entry.manha ? `<b>M:</b> ${escapeHtml(entry.manha)}<br>` : ''}
        ${entry.tarde ? `<b>T:</b> ${escapeHtml(entry.tarde)}` : ''}
      </div>
    </div>`;

      filled++;
      if(filled === 6) filled = 0;
  }

  while(filled > 0 && filled < 6){
      html += `<div class="day empty"></div>`;
      filled++;
  }

  html += `
  </div>
</div>

<script>
window.onload = function(){
    setTimeout(function(){
        window.print();
    }, 300);
}
<\/script>
</body>
</html>`;

  printWindow.document.open();
  printWindow.document.write(html);
  printWindow.document.close();
}

loadData();
</script>
</body>
</html>
